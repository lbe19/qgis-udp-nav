<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200">
  <!-- Ship hull pointing UP (north/0°). Bow at top, stern at bottom. -->
  <path d="M 50 5 L 80 60 L 80 180 L 70 195 L 30 195 L 20 180 L 20 60 Z"
        fill="param(fill) #ff4500"
        stroke="param(outline) #1f1f1f"
        stroke-width="3"/>
  <!-- Center line -->
  <line x1="50" y1="30" x2="50" y2="170"
        stroke="param(outline) #1f1f1f"
        stroke-width="1.5"
        stroke-dasharray="8,4"
        opacity="0.5"/>
</svg>
